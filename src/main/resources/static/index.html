<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#faf7f2;color:#222;padding-bottom:80px}
  header{background:#b5361f;color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:20px} header small{opacity:.85}
  main{padding:12px;display:grid;gap:14px;max-width:700px;margin:auto}
  .cat{font-weight:700;margin:10px 4px 0}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0002;overflow:hidden}
  .card .info{padding:12px}
  model-viewer{width:100%;height:240px;background:#eee}
  .ar{position:absolute;bottom:10px;right:10px;background:#b5361f;color:#fff;border:0;border-radius:20px;padding:8px 14px}
  .wrap{position:relative}
  button.add{background:#b5361f;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px}
  .preco{font-weight:700}
  #bar{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  #bar button{background:#25d366;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
  dialog{border:0;border-radius:12px;width:min(92vw,460px)}
  textarea{width:100%;box-sizing:border-box}
  .linha{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
</style>
</head>
<body>
<header><h1 id="nome">Cardápio</h1><small id="mesaTxt"></small></header>
<main id="lista">Carregando...</main>
<div id="bar" hidden><span id="resumo"></span><button onclick="abrir()">Ver pedido</button></div>

<dialog id="dlg">
  <h3>Seu pedido</h3>
  <div id="itens"></div>
  <p><b id="total"></b></p>
  <textarea id="obs" rows="2" placeholder="Observações (ex.: sem cebola)"></textarea>
  <div class="linha" style="margin-top:12px">
    <button onclick="dlg.close()">Voltar</button>
    <button class="add" onclick="enviar()">Enviar pedido</button>
  </div>
  <div id="ok"></div>
</dialog>

<script>
// A mesa vem da URL gravada na tag NFC: https://seusite/?mesa=5
const mesa = new URLSearchParams(location.search).get('mesa') || '?';
document.getElementById('mesaTxt').textContent = 'Mesa ' + mesa;
let pratos = [], carrinho = {}; // carrinho = { idDoPrato: quantidade }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');

async function carregar() {
  const cfg = await (await fetch('/api/config')).json();
  document.getElementById('nome').textContent = cfg.restaurante;
  document.title = cfg.restaurante;
  pratos = await (await fetch('/api/pratos')).json();
  desenhar();
}

function desenhar() {
  let html = '', cat = null;
  for (const p of pratos) {
    if (p.categoria !== cat) { cat = p.categoria; html += `<div class="cat">${esc(cat)}</div>`; }
    // model-viewer: mostra o 3D e o botao de AR. ar-scale="fixed" = tamanho real do prato.
    const viewer = p.modeloGlb ? `<div class="wrap"><model-viewer src="${esc(p.modeloGlb)}"
        ${p.modeloUsdz ? `ios-src="${esc(p.modeloUsdz)}"` : ''} alt="${esc(p.nome)}"
        ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed"
        camera-controls auto-rotate loading="lazy">
        <button slot="ar-button" class="ar">Ver na mesa (AR)</button></model-viewer></div>` : '';
    html += `<div class="card">${viewer}<div class="info"><b>${esc(p.nome)}</b>
      <p>${esc(p.descricao)}</p><div class="linha"><span class="preco">${brl(p.preco)}</span>
      <button class="add" onclick="mudar(${p.id},1)">+ Adicionar</button></div></div></div>`;
  }
  document.getElementById('lista').innerHTML = html || 'Cardápio vazio.';
}

function mudar(id, d) {
  carrinho[id] = Math.max(0, (carrinho[id] || 0) + d);
  if (!carrinho[id]) delete carrinho[id];
  atualizar();
}

function totalCarrinho() {
  return Object.entries(carrinho).reduce((s, [id, q]) => s + q * pratos.find(p => p.id == id).preco, 0);
}

function atualizar() {
  const qtd = Object.values(carrinho).reduce((a, b) => a + b, 0);
  document.getElementById('bar').hidden = !qtd;
  document.getElementById('resumo').textContent = qtd + ' item(ns) · ' + brl(totalCarrinho());
  document.getElementById('itens').innerHTML = Object.entries(carrinho).map(([id, q]) => {
    const p = pratos.find(x => x.id == id);
    return `<div class="linha"><span>${esc(p.nome)}</span><span>
      <button onclick="mudar(${id},-1);abrir()">-</button> ${q} <button onclick="mudar(${id},1);abrir()">+</button></span></div>`;
  }).join('');
  document.getElementById('total').textContent = 'Total: ' + brl(totalCarrinho());
}

function abrir() { atualizar(); if (!Object.keys(carrinho).length) return dlg.close(); if (!dlg.open) dlg.showModal(); }

async function enviar() {
  const itens = Object.entries(carrinho).map(([id, q]) => ({ pratoId: Number(id), qtd: q }));
  const r = await fetch('/api/pedidos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mesa, obs: document.getElementById('obs').value, itens }) });
  if (!r.ok) return alert('Não foi possível enviar. Chame o garçom.');
  const d = await r.json();
  carrinho = {}; atualizar();
  document.getElementById('ok').innerHTML = `<p>✅ Pedido #${d.id} enviado para a cozinha!</p>
    <a href="${d.whatsapp}" target="_blank">Enviar cópia pelo WhatsApp</a>`;
}
carregar();
</script>
</body>
</html>
