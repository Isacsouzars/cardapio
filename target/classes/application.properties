server.port=8080
# Banco H2 em arquivo (pasta ./data). Para producao, troque por PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/cardapio
spring.jpa.hibernate.ddl-auto=update
# Serve os arquivos do site (classpath) E os modelos 3D enviados (pasta ./uploads)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

